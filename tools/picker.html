<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختيار الطالب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800&family=Readex+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/tool.css">
<link rel="stylesheet" href="../assets/css/picker.css">
<link rel="stylesheet" href="../assets/css/picker-fun.css">
<style>
  .wheel-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .wheel-layout { grid-template-columns: 1fr; }
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 28px 20px;
  }

  .stage-tools {
    position: absolute;
    top: 14px;
    inset-inline-start: 14px;
    display: flex;
    gap: 8px;
    z-index: 3;
  }

  .wheel-box {
    position: relative;
    width: min(100%, 560px);
    aspect-ratio: 1;
    max-width: 100%;
  }

  .stage:fullscreen .wheel-box,
  .stage.pseudo-full .wheel-box {
    width: min(92vw, 78vh);
  }

  .stage:fullscreen,
  .stage.pseudo-full {
    justify-content: center;
  }

  #wheel {
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
  }

  /* المؤشر أعلى العجلة */
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 54px;
    z-index: 2;
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .25));
    transform-origin: 50% 20%;
  }

  .pointer.is-ticking { animation: flick .12s ease-out; }
  @keyframes flick { 40% { transform: translateX(-50%) rotate(-14deg); } }

  .spin-btn { min-width: 220px; font-size: 1.35rem; padding: 16px 40px; }


  /* بطاقة النتيجة */
  .result {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: blur(3px);
    z-index: 5;
    border-radius: inherit;
    padding: 16px;
  }

  .result-card {
    background: var(--surface);
    border: 2px solid var(--gold);
    border-radius: 22px;
    padding: 32px clamp(24px, 5vw, 64px);
    text-align: center;
    box-shadow: 0 30px 60px rgba(0, 0, 0, .18);
    animation: pop .45s cubic-bezier(.2, 1.4, .4, 1);
    max-width: 100%;
  }

  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  .result-label { color: var(--muted); font-size: 1.05rem; }

  .result-name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(3.5rem, 11vw, 8rem);
    line-height: 1.1;
    color: var(--brand);
    margin-block: 8px 20px;
    overflow-wrap: anywhere;
  }

  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* اللوحة الجانبية */
  .side { display: flex; flex-direction: column; gap: 16px; }

  #names { min-height: 260px; resize: vertical; line-height: 1.8; }
  #names[readonly] { background: var(--surface-2); color: var(--muted); cursor: default; }

  .class-select {
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    width: 100%;
  }

  .stage-class {
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    color: var(--muted);
    margin-top: 8px;
  }

  .class-note { font-size: .85rem; color: var(--muted); margin-top: 8px; }

  .count {
    font-family: var(--font-body);
    font-size: .85rem;
    font-weight: 500;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .row .btn { padding: 8px 14px; font-size: .9rem; }

  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: .93rem;
    cursor: pointer;
  }
  .check input { width: 20px; height: 20px; accent-color: var(--brand); }

  .picked {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .picked li {
    background: var(--surface-2);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: .9rem;
  }

  .picked li b {
    font-weight: 500;
    color: var(--muted);
    font-size: .8rem;
    margin-inline-end: 4px;
    font-variant-numeric: tabular-nums;
  }

  .empty-note { color: var(--muted); font-size: .9rem; }

  .stage-msg {
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>

<header id="siteHeader" data-base="../" data-page="tools"></header>

<main class="wrap">
  <div class="tool-bar">
    <a class="back-link" href="../tools.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      الأدوات
    </a>
    <h1>اختيار الطالب</h1>
    <span class="tag tag-free">مجانية</span>
  </div>

  <div class="wheel-layout">
    <section class="stage" id="stage" aria-label="اختيار الطالب">
      <div class="stage-tools">
        <button class="icon-btn" type="button" id="soundBtn" aria-pressed="true" title="الصوت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="sound-off" d="m16 9 6 6m0-6-6 6" hidden/></svg>
        </button>
        <button class="icon-btn" type="button" id="fullBtn" title="ملء الشاشة (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <p class="stage-class" id="stageClass" hidden></p>
      <div class="stage-mode" id="stageMode"></div>

      <div class="mode-view" id="modeView" hidden></div>

      <div class="wheel-box" id="wheelBox">
        <svg class="pointer" id="pointer" viewBox="0 0 44 54" aria-hidden="true"><path d="M22 52 4 14a18 18 0 1 1 36 0z" fill="#C0913F"/><circle cx="22" cy="18" r="7" fill="#fff"/></svg>
        <canvas id="wheel" aria-label="عجلة أسماء الطلاب، اضغط لتدويرها"></canvas>
      </div>

      <p class="stage-msg" id="stageMsg" hidden>أضف اسمين على الأقل في قائمة الطلاب.</p>

      <button class="btn btn-primary spin-btn" type="button" id="spinBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span id="spinLabel">أدِر العجلة</span>
      </button>
      <p class="kbd-hint">اختصار: <kbd>مسافة</kbd> للاختيار، <kbd>F</kbd> لملء الشاشة</p>

      <div class="result" id="result" hidden>
        <div class="result-card" role="dialog" aria-live="assertive" aria-labelledby="resultName">
          <div class="result-label">الطالب المشارك</div>
          <div class="result-name" id="resultName"></div>
          <div class="result-actions">
            <button class="btn btn-primary btn-lg" type="button" id="againBtn">اختيار طالب آخر</button>
            <button class="btn btn-ghost btn-lg" type="button" id="closeBtn">إغلاق</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="side">
      <div class="panel">
        <h2>طريقة الاختيار</h2>
        <div class="mode-groups" id="modeGroups" role="group" aria-label="نوع الأشكال"></div>
        <div class="modes" id="modes" role="group" aria-label="طريقة الاختيار"></div>
        <p class="mode-desc" id="modeDesc"></p>
        <div class="mode-opts" id="tickerOpts" hidden>
          <label class="field-label" for="tickerDir">اتجاه الشريط</label>
          <select id="tickerDir" class="class-select">
            <option value="v">رأسي (من أعلى لأسفل)</option>
            <option value="h">أفقي (من جانب لآخر)</option>
          </select>
        </div>
      </div>

      <div class="panel">
        <h2>قائمة الطلاب <span class="count" id="count"></span></h2>
        <label class="field-label" for="classSelect">الصف</label>
        <select id="classSelect" class="class-select"></select>
        <p class="class-note" id="classNote" hidden></p>
        <label class="field-label" for="names" id="namesLabel" style="margin-top:12px">اكتب اسم كل طالب في سطر مستقل، أو الصق القائمة من ملف.</label>
        <textarea id="names" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn btn-ghost" type="button" id="shuffleBtn">خلط الترتيب</button>
          <button class="btn btn-ghost" type="button" id="clearBtn">مسح القائمة</button>
        </div>
        <div style="margin-top:14px">
          <label class="field-label" for="labelMode">الاسم الظاهر أثناء الاختيار (النتيجة تظهر بالاسم كاملًا)</label>
          <select id="labelMode" class="class-select">
            <option value="2">الاسم الأول والثاني</option>
            <option value="1">الاسم الأول فقط</option>
            <option value="all">الاسم كاملًا</option>
          </select>
        </div>
        <label class="check">
          <input type="checkbox" id="removePicked" checked>
          استبعاد الطالب بعد اختياره حتى يشارك الجميع
        </label>
      </div>

      <div class="panel">
        <h2>
          شاركوا
          <button class="btn btn-ghost" type="button" id="resetPickedBtn" style="padding:6px 12px;font-size:.85rem">إعادة الجميع</button>
        </h2>
        <ol class="picked" id="picked"></ol>
        <p class="empty-note" id="pickedEmpty">لم يُختر أحد بعد.</p>
      </div>
    </aside>
  </div>
</main>

<footer id="siteFooter" data-base="../"></footer>
<script src="../assets/js/layout.js"></script>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/classes-store.js"></script>
<script src="../assets/js/picker-modes.js"></script>
<script src="../assets/js/picker-fun.js"></script>
<script>
(function () {
  const { store, sound, toggleFullscreen } = window.Rafeeq;

  const SAMPLE = ['عبدالله', 'سارة', 'يوسف', 'نورة', 'خالد', 'مريم', 'فهد', 'ريم', 'عمر', 'لطيفة', 'حمد', 'جود', 'سلطان', 'دانة', 'راشد', 'هيا'];
  const COLORS = ['#0C7051', '#C0913F', '#0D4261', '#129B82', '#8067A4', '#DD7877', '#4194B3', '#E9C56B', '#5A895A', '#1490A0'];
  const LIGHT = new Set(['#E9C56B']);

  const el = id => document.getElementById(id);
  const canvas = el('wheel');
  const ctx = canvas.getContext('2d');
  const namesInput = el('names');

  const Classes = window.RafeeqClasses;
  let source = ''; // '' = قائمة يدوية، وإلا معرّف الصف
  let picked = [];
  const pickedKey = () => 'wheel:picked:' + (source || 'manual');
  let rotation = 0;
  let spinning = false;
  let lastPick = null;

  // تحميل أسماء الصف المختار، أو القائمة اليدوية المحفوظة
  function loadSource(id) {
    const cls = id ? Classes.get(id) : null;
    source = cls ? cls.id : '';
    Classes.setActive(source);
    const isClass = !!cls;
    namesInput.value = isClass
      ? cls.students.map(st => st.name).join('\n')
      : store.get('wheel:names', SAMPLE).join('\n');
    namesInput.readOnly = isClass;
    el('namesLabel').textContent = isClass
      ? 'أسماء طلاب الصف (للتعديل افتح صفحة صفوفي)'
      : 'اكتب اسم كل طالب في سطر مستقل، أو الصق القائمة من ملف.';
    el('clearBtn').hidden = isClass;
    el('classNote').hidden = !isClass || cls.students.length > 0;
    el('classNote').innerHTML = 'لا يوجد طلاب في هذا الصف بعد. <a href="../classes.html#' + source + '">أضف الأسماء من صفوفي</a>.';
    el('stageClass').hidden = !isClass;
    el('stageClass').textContent = isClass ? Classes.label(cls) : '';
    picked = store.get(pickedKey(), []);
    viewWinner = false;
    renderPicked();
    draw();
  }

  function initClassSelect() {
    const sel = el('classSelect');
    const count = Classes.fillSelect(sel, { emptyLabel: 'قائمة يدوية' });
    if (!count) {
      sel.innerHTML = '<option value="">قائمة يدوية</option>';
      el('classNote').hidden = false;
    }
    sel.addEventListener('change', () => { closeResult(); loadSource(sel.value); });
    return Classes.get(Classes.getActive()) ? Classes.getActive() : '';
  }
  el('removePicked').checked = store.get('wheel:removePicked', true);

  function allNames() {
    return namesInput.value.split('\n').map(s => s.trim()).filter(Boolean);
  }

  // الأسماء الظاهرة على العجلة (مع استبعاد من شارك إن كان الخيار مفعلًا)
  function pool() {
    const names = allNames();
    if (!el('removePicked').checked) return names;
    const left = names.slice();
    picked.forEach(p => {
      const i = left.indexOf(p);
      if (i > -1) left.splice(i, 1);
    });
    return left;
  }

  // تقسيم الاسم إلى أجزاء مع دمج «عبد/أبو/بن» مع ما بعدها: «عبد الرحمن جاسم» = [عبد الرحمن، جاسم]
  function nameParts(full) {
    const t = full.split(/\s+/).filter(Boolean);
    const parts = [];
    for (let i = 0; i < t.length; i++) {
      let w = t[i];
      while (/^(عبد|ابو|أبو|بو|بن|بنت|ابن|آل)$/.test(w.split(' ').pop()) && t[i + 1]) w += ' ' + t[++i];
      parts.push(w);
    }
    return parts;
  }

  // أسماء العجلة المختصرة، مع إطالة الاسم تلقائيًا إن تشابه اسمان مختصران
  function wheelLabels(names) {
    const mode = el('labelMode').value;
    const parts = names.map(nameParts);
    if (mode === 'all') return names.slice();
    const level = parts.map(() => mode === '1' ? 1 : 2);
    for (let round = 0; round < 6; round++) {
      const labels = parts.map((p, i) => p.slice(0, level[i]).join(' '));
      const seen = new Map();
      labels.forEach((l, i) => seen.set(l, (seen.get(l) || []).concat(i)));
      let changed = false;
      seen.forEach(idx => {
        if (idx.length > 1) idx.forEach(i => { if (level[i] < parts[i].length) { level[i]++; changed = true; } });
      });
      if (!changed) return labels;
    }
    return parts.map((p, i) => p.slice(0, level[i]).join(' '));
  }

  function colorFor(i, n) {
    let c = COLORS[i % COLORS.length];
    // تجنب تطابق لون أول شريحة وآخر شريحة
    if (i === n - 1 && n > 1 && c === COLORS[0]) c = COLORS[2];
    return c;
  }

  function fontStack() {
    return '"Readex Pro", Tahoma, sans-serif';
  }

  // تحديث العداد والرسائل وحالة زر الاختيار
  function updateStatus(n) {
    el('count').textContent = el('removePicked').checked && picked.length
      ? `${n} من ${allNames().length}`
      : `${allNames().length} طالب`;
    const tooFew = n < 2;
    el('stageMsg').hidden = !tooFew;
    el('stageMsg').textContent = allNames().length >= 2 && tooFew
      ? 'شارك جميع الطلاب. اضغط «إعادة الجميع» لبدء جولة جديدة.'
      : 'أضف اسمين على الأقل في قائمة الطلاب.';
    el('spinBtn').disabled = tooFew || spinning;
    if (mode !== 'wheel' && !spinning && !viewWinner) renderView();
  }

  function draw() {
    const size = canvas.clientWidth;
    const dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(size * dpr)) {
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = size / 2;
    const r = c - 6;
    const names = pool();
    const n = names.length;
    updateStatus(n);
    if (size < 40) return; // العجلة مخفية (وضع القرعة)
    const labels = wheelLabels(names);
    const styles = getComputedStyle(document.documentElement);
    ctx.clearRect(0, 0, size, size);

    // الإطار الخارجي
    ctx.beginPath();
    ctx.arc(c, c, r + 4, 0, Math.PI * 2);
    ctx.fillStyle = styles.getPropertyValue('--line').trim() || '#D7E2DC';
    ctx.fill();

    if (n === 0) {
      ctx.beginPath();
      ctx.arc(c, c, r, 0, Math.PI * 2);
      ctx.fillStyle = styles.getPropertyValue('--surface-2').trim();
      ctx.fill();
    }

    const step = (Math.PI * 2) / Math.max(n, 1);
    const fontSize = Math.max(11, Math.min(size / 17, (Math.PI * r * 0.9) / Math.max(n, 1)));

    for (let i = 0; i < n; i++) {
      const a0 = rotation + i * step;
      const color = colorFor(i, n);
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a0 + step);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      if (n > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,.55)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(c, c);
      const mid = a0 + step / 2;
      const norm = ((mid % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      // في النصف الأيسر نقلب النص حتى لا يظهر مقلوبًا
      const flip = norm > Math.PI / 2 && norm < Math.PI * 1.5;
      ctx.rotate(flip ? mid + Math.PI : mid);
      ctx.fillStyle = LIGHT.has(color) ? '#2B2410' : '#FFFFFF';
      ctx.textAlign = flip ? 'left' : 'right';
      ctx.textBaseline = 'middle';
      ctx.direction = 'rtl';
      let label = labels[i];
      const maxW = r * 0.8 - 16;
      // تصغير الخط للأسماء الطويلة أولًا، ثم الاختصار إن بقي الاسم أطول من الشريحة
      let fs = fontSize;
      ctx.font = `600 ${fs}px ${fontStack()}`;
      while (ctx.measureText(label).width > maxW && fs > fontSize * 0.62) {
        fs -= 1;
        ctx.font = `600 ${fs}px ${fontStack()}`;
      }
      while (ctx.measureText(label).width > maxW && label.length > 2) label = label.slice(0, -1);
      if (label !== labels[i]) label += '…';
      ctx.fillText(label, flip ? -(r - 16) : r - 16, 0);
      ctx.restore();
    }

    // المحور
    ctx.beginPath();
    ctx.arc(c, c, Math.max(18, r * 0.09), 0, Math.PI * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#C0913F';
    ctx.stroke();

  }

  // مؤشر الشريحة الواقعة تحت السهم العلوي
  function indexAtPointer(rot, n) {
    const step = (Math.PI * 2) / n;
    let a = (-Math.PI / 2 - rot) % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return Math.floor(a / step) % n;
  }

  function randomInt(max) {
    try {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % max;
    } catch (e) {
      return Math.floor(Math.random() * max);
    }
  }

  // ---------- طرق الاختيار ----------
  const Modes = window.PickerModes;
  const MODE_IDS = Modes.list.map(m => m.id);
  let mode = store.get('wheel:mode', 'wheel');
  if (mode === 'draw') mode = 'digital'; // اسم الطريقة القديم
  if (!MODE_IDS.includes(mode)) mode = 'wheel';
  let viewWinner = false;
  const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let group = (Modes.list.find(m => m.id === mode) || {}).group || 'calm';

  function renderModeTiles() {
    el('modeGroups').innerHTML = Modes.groups.map(g =>
      `<button type="button" data-group="${g.id}" aria-pressed="${g.id === group}">${g.name}</button>`).join('');
    el('modes').innerHTML = Modes.list.filter(m => m.group === group).map(m =>
      `<button type="button" class="mode-tile" data-mode="${m.id}" aria-pressed="${m.id === mode}" title="${m.desc}">${m.icon}<span>${m.name}</span></button>`).join('');
  }

  function modeCtx(names, target) {
    return {
      names,
      labels: wheelLabels(names),
      parts: names.map(nameParts),
      target,
      sound,
      randomInt,
      reduced: reducedMotion(),
      opts: { tickerDir: el('tickerDir').value }
    };
  }

  // عرض الحالة الساكنة للطريقة الحالية
  function renderView() {
    if (mode === 'wheel') return;
    const names = pool();
    const view = el('modeView');
    if (names.length < 2) { view.innerHTML = ''; return; }
    Modes.impl[mode].render(view, modeCtx(names, 0));
  }

  function setMode(m) {
    if (spinning) return;
    mode = MODE_IDS.includes(m) ? m : 'wheel';
    store.set('wheel:mode', mode);
    const info = Modes.list.find(x => x.id === mode);
    document.querySelectorAll('.mode-tile').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    el('modeDesc').textContent = info.desc;
    el('stageMode').innerHTML = info.icon + '<span>' + info.name + '</span>';
    el('tickerOpts').hidden = mode !== 'ticker';
    el('wheelBox').hidden = mode !== 'wheel';
    el('modeView').hidden = mode === 'wheel';
    el('spinLabel').textContent = mode === 'wheel' ? 'أدِر العجلة' : 'اختر طالبًا';
    el('result').hidden = true;
    viewWinner = false;
    draw();
    renderView();
  }

  async function runMode() {
    const names = pool();
    const n = names.length;
    if (spinning || n < 2) return;
    spinning = true;
    viewWinner = false;
    el('spinBtn').disabled = true;
    el('result').hidden = true;
    const impl = Modes.impl[mode];
    const target = randomInt(n);
    const c = modeCtx(names, target);
    const view = el('modeView');
    impl.render(view, c);
    await new Promise(r => requestAnimationFrame(r));
    try {
      await impl.run(view, c);
    } catch (e) { /* نكمل بإظهار النتيجة */ }
    spinning = false;
    viewWinner = true;
    const name = names[target];
    if (impl.reveals) {
      recordPick(name);
      sound.win();
      updateStatus(pool().length);
    } else {
      // نترك لحظة ليرى الصف النتيجة داخل الطريقة، ثم تظهر بطاقة الاسم كاملًا
      recordPick(name);
      sound.win();
      setTimeout(() => {
        if (viewWinner && !spinning) { el('resultName').textContent = name; el('result').hidden = false; el('againBtn').focus(); }
      }, 1300);
      updateStatus(pool().length);
    }
  }

  function choose() {
    if (mode === 'wheel') spin(); else runMode();
  }

  function spin() {
    const names = pool();
    const n = names.length;
    if (spinning || n < 2) return;
    spinning = true;
    el('spinBtn').disabled = true;
    el('result').hidden = true;

    const step = (Math.PI * 2) / n;
    const target = randomInt(n);
    const jitter = (Math.random() - 0.5) * step * 0.7;
    const full = Math.PI * 2;
    // الزاوية التي تجعل منتصف الشريحة المختارة تحت المؤشر
    let end = -Math.PI / 2 - (target + 0.5) * step + jitter;
    const turns = 6 + randomInt(3);
    const base = rotation - (rotation % full);
    end = base + turns * full + ((end % full) + full) % full;
    if (end - rotation < 5 * full) end += full;

    const start = rotation;
    const duration = 5200 + randomInt(1200);
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const t0 = performance.now();
    let lastIdx = indexAtPointer(rotation, n);
    const pointer = el('pointer');

    function frame(now) {
      const t = reduced ? 1 : Math.min(1, (now - t0) / duration);
      const eased = 1 - Math.pow(1 - t, 4);
      rotation = start + (end - start) * eased;
      draw();
      const idx = indexAtPointer(rotation, n);
      if (idx !== lastIdx) {
        lastIdx = idx;
        sound.tick();
        pointer.classList.remove('is-ticking');
        void pointer.offsetWidth;
        pointer.classList.add('is-ticking');
      }
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = rotation % full;
        spinning = false;
        finish(names[indexAtPointer(rotation, n)]);
      }
    }
    requestAnimationFrame(frame);
  }

  function recordPick(name) {
    lastPick = name;
    picked.push(name);
    store.set(pickedKey(), picked);
    renderPicked();
  }

  function finish(name) {
    recordPick(name);
    updateStatus(pool().length);
    el('resultName').textContent = name;
    el('result').hidden = false;
    sound.win();
    renderPicked();
    el('againBtn').focus();
  }

  function closeResult() {
    el('result').hidden = true;
    if (mode !== 'wheel') viewWinner = false;
    draw();
  }

  function renderPicked() {
    el('picked').innerHTML = picked.map((p, i) => `<li><b>${i + 1}</b>${escapeHtml(p)}</li>`).join('');
    el('pickedEmpty').hidden = picked.length > 0;
    el('resetPickedBtn').hidden = picked.length === 0;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  // الأحداث
  el('spinBtn').addEventListener('click', choose);
  canvas.addEventListener('click', spin);
  el('modes').addEventListener('click', e => { const b = e.target.closest('.mode-tile'); if (b) setMode(b.dataset.mode); });
  el('modeGroups').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || spinning) return;
    group = b.dataset.group;
    renderModeTiles();
    // الانتقال لأول طريقة في المجموعة إن كانت الحالية من مجموعة أخرى
    const cur = Modes.list.find(m => m.id === mode);
    if (!cur || cur.group !== group) setMode(Modes.list.find(m => m.group === group).id);
  });
  el('tickerDir').value = store.get('wheel:tickerDir', 'v');
  el('tickerDir').addEventListener('change', e => { store.set('wheel:tickerDir', e.target.value); viewWinner = false; renderView(); });
  window.addEventListener('resize', () => { if (!spinning && !viewWinner) renderView(); });
  el('labelMode').value = store.get('wheel:labelMode', '2');
  el('labelMode').addEventListener('change', e => { store.set('wheel:labelMode', e.target.value); draw(); });
  el('againBtn').addEventListener('click', () => { closeResult(); choose(); });
  el('closeBtn').addEventListener('click', closeResult);

  namesInput.addEventListener('input', () => {
    if (source) return;
    store.set('wheel:names', allNames());
    draw();
  });

  el('removePicked').addEventListener('change', e => {
    store.set('wheel:removePicked', e.target.checked);
    draw();
  });

  el('shuffleBtn').addEventListener('click', () => {
    const arr = allNames();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    namesInput.value = arr.join('\n');
    if (!source) store.set('wheel:names', arr);
    draw();
  });

  el('clearBtn').addEventListener('click', () => {
    namesInput.value = '';
    store.set('wheel:names', []);
    picked = [];
    store.set(pickedKey(), picked);
    renderPicked();
    draw();
    namesInput.focus();
  });

  el('resetPickedBtn').addEventListener('click', () => {
    viewWinner = false;
    picked = [];
    store.set(pickedKey(), picked);
    renderPicked();
    draw();
  });

  function syncSoundBtn() {
    const btn = el('soundBtn');
    btn.setAttribute('aria-pressed', String(sound.enabled));
    btn.querySelector('.sound-wave').toggleAttribute('hidden', !sound.enabled);
    btn.querySelector('.sound-off').toggleAttribute('hidden', sound.enabled);
    btn.title = sound.enabled ? 'كتم الصوت' : 'تشغيل الصوت';
  }
  el('soundBtn').addEventListener('click', () => { sound.toggle(); syncSoundBtn(); });
  el('fullBtn').addEventListener('click', () => toggleFullscreen(el('stage')));

  document.addEventListener('keydown', e => {
    const typing = /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
    if (typing) return;
    // تفادي تنفيذ الأمر مرتين إذا كان التركيز على زر
    if (e.code === 'Space' && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (e.code === 'Space' || (e.key === 'Enter' && document.activeElement === document.body)) {
      e.preventDefault();
      if (!el('result').hidden) closeResult();
      choose();
    } else if (e.key === 'f' || e.key === 'F' || e.key === 'ب') {
      toggleFullscreen(el('stage'));
    } else if (e.key === 'Escape') {
      el('stage').classList.remove('pseudo-full');
      if (!el('result').hidden) closeResult();
    }
  });

  window.addEventListener('resize', draw);
  document.addEventListener('fullscreenchange', () => requestAnimationFrame(draw));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  syncSoundBtn();
  const startSource = initClassSelect();
  loadSource(startSource);
  renderModeTiles();
  setMode(mode);
  if (!Classes.all().length) {
    el('classNote').hidden = false;
    el('classNote').innerHTML = 'ارفع أسماء طلابك مرة واحدة من <a href="../classes.html">صفوفي</a> لتظهر هنا تلقائيًا عند اختيار الصف.';
  }
})();
</script>
</body>
</html>
