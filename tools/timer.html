<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤقت الأنشطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800&family=Readex+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/tool.css">
<style>
  .timer-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .timer-layout { grid-template-columns: 1fr; }
  }

  .stage {
    --ring: var(--brand);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 28px 20px 32px;
  }

  .stage.is-warn { --ring: var(--gold); }
  .stage.is-done { --ring: var(--danger); }

  .stage:fullscreen,
  .stage.pseudo-full { justify-content: center; }

  .stage-tools {
    position: absolute;
    top: 14px;
    inset-inline-start: 14px;
    display: flex;
    gap: 8px;
    z-index: 3;
  }

  .activity {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
    margin-top: 16px;
  }

  .dial {
    position: relative;
    width: min(100%, 520px);
    aspect-ratio: 1;
    max-width: 100%;
  }

  .stage:fullscreen .dial,
  .stage.pseudo-full .dial { width: min(90vw, 68vh); }

  .dial svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }

  .dial .track { stroke: var(--surface-2); }
  .dial .progress {
    stroke: var(--ring);
    transition: stroke .3s;
  }

  .readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: clamp(4rem, 15vw, 9rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    direction: ltr;
    color: var(--ink);
    letter-spacing: -.02em;
  }

  .stage:fullscreen .time,
  .stage.pseudo-full .time { font-size: min(19vw, 15vh); }

  .stage.is-done .time { color: var(--danger); animation: blink 1s steps(2, start) infinite; }
  .time { transition: color .2s; }
  @keyframes blink { to { opacity: .35; } }

  .state-text { color: var(--muted); font-size: 1rem; }

  .stage.is-urgent { --ring: var(--danger); }
  .stage.is-urgent .time { color: var(--danger); animation: throb 1s ease-out infinite; }
  @keyframes throb { 0% { transform: scale(1.08); } 40% { transform: scale(1); } }

  /* أزرار التحكم بالرموز */
  .controls { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }

  .ctrl {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, transform .1s, opacity .15s;
  }
  .ctrl svg { width: 28px; height: 28px; }
  .ctrl:hover:not([disabled]) { background: var(--surface-2); }
  .ctrl:active:not([disabled]) { transform: scale(.94); }
  .ctrl[disabled] { opacity: .3; cursor: not-allowed; }

  .ctrl.is-main {
    width: 88px;
    height: 88px;
    background: var(--brand);
    border-color: var(--brand);
    color: var(--on-brand);
  }
  .ctrl.is-main svg { width: 38px; height: 38px; }
  .ctrl.is-main:hover:not([disabled]) { background: var(--brand-deep); }
  .ctrl.is-stop:hover:not([disabled]) { color: var(--danger); }

  /* إضافة وقت */
  .add-time {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 8px 6px 6px;
  }
  .add-time .lbl { font-weight: 600; font-size: .95rem; padding-inline: 10px 2px; color: var(--muted); }
  .add-time input {
    width: 76px;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 999px;
    background: var(--surface);
    font-variant-numeric: tabular-nums;
  }
  .unit {
    display: inline-flex;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 3px;
  }
  .unit button {
    font: inherit;
    font-size: .9rem;
    font-weight: 600;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .unit button[aria-pressed="true"] { background: var(--surface); color: var(--brand); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .add-time .btn { padding: 8px 18px; }
  .add-flash { animation: flash .6s ease-out; }
  @keyframes flash { from { color: var(--brand); transform: scale(1.06); } }

  /* اللوحة الجانبية */
  .side { display: flex; flex-direction: column; gap: 16px; }

  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .preset {
    font: inherit;
    font-weight: 600;
    padding: 12px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .preset:hover { border-color: var(--brand); }
  .preset[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

  .custom {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: end;
  }

  .custom input { text-align: center; font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit;
    font-size: .88rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { background: var(--surface-2); }
</style>
</head>
<body>

<header id="siteHeader" data-base="../" data-page="tools"></header>

<main class="wrap">
  <div class="tool-bar">
    <a class="back-link" href="../tools.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      الأدوات
    </a>
    <h1>مؤقت الأنشطة</h1>
    <span class="tag tag-free">مجانية</span>
  </div>

  <div class="timer-layout">
    <section class="stage" id="stage" aria-label="المؤقت">
      <div class="stage-tools">
        <button class="icon-btn" type="button" id="soundBtn" aria-pressed="true" title="الصوت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="sound-off" d="m16 9 6 6m0-6-6 6" hidden/></svg>
        </button>
        <button class="icon-btn" type="button" id="fullBtn" title="ملء الشاشة (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <div class="activity" id="activityOut">نشاط جماعي</div>

      <div class="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="14"/>
          <circle class="progress" id="progress" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round"/>
        </svg>
        <div class="readout">
          <div class="time" id="time" role="timer" aria-live="off">03:00</div>
          <div class="state-text" id="stateText">جاهز</div>
        </div>
      </div>

      <div class="controls" role="group" aria-label="التحكم بالمؤقت">
        <button class="ctrl is-main" type="button" id="playBtn" title="تشغيل (مسافة)" aria-label="تشغيل">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
        <button class="ctrl" type="button" id="pauseBtn" title="إيقاف مؤقت (مسافة)" aria-label="إيقاف مؤقت">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
        </button>
        <button class="ctrl" type="button" id="restartBtn" title="إعادة من البداية (R)" aria-label="إعادة من البداية">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="ctrl is-stop" type="button" id="stopBtn" title="إيقاف (S)" aria-label="إيقاف">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>

      <form class="add-time" id="addForm" aria-label="إضافة وقت">
        <span class="lbl">إضافة وقت</span>
        <input type="number" id="addAmount" min="1" max="180" value="30" inputmode="numeric" aria-label="مقدار الوقت المضاف">
        <span class="unit" role="group" aria-label="الوحدة">
          <button type="button" data-unit="sec" aria-pressed="true">ثانية</button>
          <button type="button" data-unit="min" aria-pressed="false">دقيقة</button>
        </span>
        <button class="btn btn-primary" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          إضافة
        </button>
      </form>
      <p class="kbd-hint">اختصار: <kbd>مسافة</kbd> تشغيل وإيقاف مؤقت، <kbd>R</kbd> إعادة، <kbd>S</kbd> إيقاف، <kbd>F</kbd> ملء الشاشة</p>
    </section>

    <aside class="side">
      <div class="panel">
        <h2>مدة النشاط</h2>
        <div class="presets" id="presets"></div>
        <div class="custom" style="margin-top:14px">
          <div>
            <label class="field-label" for="minInput">دقائق</label>
            <input type="number" id="minInput" min="0" max="180" value="3" inputmode="numeric">
          </div>
          <div>
            <label class="field-label" for="secInput">ثوانٍ</label>
            <input type="number" id="secInput" min="0" max="59" value="0" inputmode="numeric">
          </div>
          <button class="btn btn-ghost" type="button" id="setBtn">تعيين</button>
        </div>
      </div>

      <div class="panel">
        <h2>اسم النشاط</h2>
        <label class="field-label" for="activityInput">يظهر أعلى المؤقت ليعرف الطلاب المطلوب.</label>
        <input type="text" id="activityInput" value="نشاط جماعي" maxlength="40">
        <div class="chips" style="margin-top:10px">
          <button class="chip" type="button">نشاط جماعي</button>
          <button class="chip" type="button">عمل فردي</button>
          <button class="chip" type="button">نقاش</button>
          <button class="chip" type="button">قراءة صامتة</button>
          <button class="chip" type="button">تقويم ختامي</button>
          <button class="chip" type="button">استراحة</button>
        </div>
      </div>
    </aside>
  </div>
</main>

<footer id="siteFooter" data-base="../"></footer>
<script src="../assets/js/layout.js"></script>

<script src="../assets/js/common.js"></script>
<script>
(function () {
  const { store, sound, toggleFullscreen } = window.Rafeeq;
  const el = id => document.getElementById(id);

  const PRESETS = [30, 60, 120, 180, 300, 600, 900, 1200, 1800];
  const WARN_AT = 10;   // آخر 10 ثوانٍ: لون ذهبي وصوت دقات متوترة
  const URGENT_AT = 3;  // آخر 3 ثوانٍ: لون أحمر وصوت أشد

  const ring = el('progress');
  const CIRC = 2 * Math.PI * 88;
  ring.style.strokeDasharray = CIRC;

  let baseTotal = store.get('timer:total', 180); // المدة المختارة
  let total = baseTotal;                          // مدة الجولة الحالية (تزيد عند إضافة وقت)
  let remainingMs = total * 1000;
  let running = false;
  let finished = false;
  let endAt = 0;
  let raf = 0;
  let lastWholeSec = null;
  let wakeLock = null;
  let addUnit = store.get('timer:addUnit', 'sec');

  function fmt(sec) {
    const s = Math.max(0, Math.ceil(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function label(sec) {
    if (sec < 60) return sec + ' ث';
    return sec / 60 + ' د';
  }

  function renderPresets() {
    el('presets').innerHTML = PRESETS.map(s =>
      `<button class="preset" type="button" data-sec="${s}" aria-pressed="${s === baseTotal}">${label(s)}</button>`
    ).join('');
  }

  function state() {
    if (running) return 'running';
    if (finished) return 'done';
    if (remainingMs < total * 1000 || total !== baseTotal) return 'paused';
    return 'idle';
  }

  function render() {
    const sec = remainingMs / 1000;
    const st = state();
    el('time').textContent = fmt(sec);
    const frac = total > 0 ? Math.max(0, Math.min(1, remainingMs / (total * 1000))) : 0;
    ring.style.strokeDashoffset = CIRC * (1 - frac);

    const stage = el('stage');
    const whole = Math.ceil(sec);
    stage.classList.toggle('is-done', st === 'done');
    stage.classList.toggle('is-urgent', st === 'running' && whole <= URGENT_AT);
    stage.classList.toggle('is-warn', st === 'running' && whole <= WARN_AT && whole > URGENT_AT);
    el('stateText').textContent = { running: 'جارٍ', done: 'انتهى الوقت', paused: 'متوقف مؤقتًا', idle: 'جاهز' }[st];

    // تفعيل الأزرار حسب الحالة
    const play = el('playBtn');
    play.disabled = st === 'running';
    const playLabel = st === 'paused' ? 'استئناف' : st === 'done' ? 'تشغيل من جديد' : 'تشغيل';
    play.title = playLabel + ' (مسافة)';
    play.setAttribute('aria-label', playLabel);
    el('pauseBtn').disabled = st !== 'running';
    el('stopBtn').disabled = st === 'idle';
    el('restartBtn').disabled = st === 'idle';

    document.title = st === 'running' ? fmt(sec) + ' · مؤقت الأنشطة' : 'مؤقت الأنشطة';
  }

  function onSecond(whole) {
    if (whole > URGENT_AT && whole <= WARN_AT) sound.tension(whole);
    else if (whole > 0 && whole <= URGENT_AT) sound.urgent(whole);
  }

  function loop() {
    remainingMs = Math.max(0, endAt - performance.now());
    const whole = Math.ceil(remainingMs / 1000);
    if (whole !== lastWholeSec) {
      lastWholeSec = whole;
      onSecond(whole);
    }
    if (remainingMs <= 0) {
      running = false;
      finished = true;
      sound.finish();
      releaseWake();
      render();
      return;
    }
    render();
    raf = requestAnimationFrame(loop);
  }

  function play() {
    if (running) return;
    if (finished || remainingMs <= 0) { restart(); return; }
    running = true;
    finished = false;
    // لا نعيد صوت الثانية الحالية عند الاستئناف
    lastWholeSec = Math.ceil(remainingMs / 1000);
    endAt = performance.now() + remainingMs;
    requestWake();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
    render();
  }

  function pause() {
    if (!running) return;
    remainingMs = Math.max(0, endAt - performance.now());
    running = false;
    cancelAnimationFrame(raf);
    releaseWake();
    render();
  }

  // إيقاف: ينهي الجولة ويعيد المؤقت إلى المدة المختارة دون تشغيل
  function stop() {
    running = false;
    finished = false;
    cancelAnimationFrame(raf);
    releaseWake();
    total = baseTotal;
    remainingMs = total * 1000;
    lastWholeSec = null;
    render();
  }

  // إعادة: يبدأ الجولة من أولها مباشرة
  function restart() {
    stop();
    play();
  }

  function setTotal(sec) {
    baseTotal = Math.max(1, Math.min(180 * 60, Math.round(sec)));
    store.set('timer:total', baseTotal);
    el('minInput').value = Math.floor(baseTotal / 60);
    el('secInput').value = baseTotal % 60;
    renderPresets();
    stop();
  }

  function addTime(sec) {
    if (!(sec > 0)) return;
    const ms = sec * 1000;
    if (running) {
      endAt += ms;
      total += sec;
    } else if (finished) {
      // بعد انتهاء الوقت: نبدأ جولة إضافية بالمدة المضافة مباشرة
      finished = false;
      total = sec;
      remainingMs = ms;
      play();
    } else {
      remainingMs += ms;
      total = Math.max(total, Math.ceil(remainingMs / 1000));
    }
    lastWholeSec = null;
    render();
    const t = el('time');
    t.classList.remove('add-flash');
    void t.offsetWidth;
    t.classList.add('add-flash');
  }

  function syncUnit() {
    document.querySelectorAll('.unit button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === addUnit)));
  }

  // إبقاء الشاشة مضاءة أثناء العد
  async function requestWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) { /* تجاهل */ }
    wakeLock = null;
  }

  function setActivity(text) {
    el('activityOut').textContent = text;
    el('activityInput').value = text;
    store.set('timer:activity', text);
  }

  // الأحداث
  el('playBtn').addEventListener('click', play);
  el('pauseBtn').addEventListener('click', pause);
  el('stopBtn').addEventListener('click', stop);
  el('restartBtn').addEventListener('click', restart);

  document.querySelectorAll('.unit button').forEach(b => b.addEventListener('click', () => {
    addUnit = b.dataset.unit;
    store.set('timer:addUnit', addUnit);
    syncUnit();
  }));
  el('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const n = Math.min(180, Math.max(0, Math.round(Number(el('addAmount').value) || 0)));
    if (!n) { el('addAmount').focus(); return; }
    addTime(addUnit === 'min' ? n * 60 : n);
  });
  el('presets').addEventListener('click', e => {
    const b = e.target.closest('.preset');
    if (b) setTotal(Number(b.dataset.sec));
  });
  el('setBtn').addEventListener('click', () => {
    const m = Number(el('minInput').value) || 0;
    const s = Math.min(59, Number(el('secInput').value) || 0);
    if (m * 60 + s > 0) setTotal(m * 60 + s);
  });
  [el('minInput'), el('secInput')].forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') el('setBtn').click();
  }));
  el('activityInput').addEventListener('input', e => {
    el('activityOut').textContent = e.target.value;
    store.set('timer:activity', e.target.value);
  });
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => setActivity(c.textContent)));

  function syncSoundBtn() {
    const btn = el('soundBtn');
    btn.setAttribute('aria-pressed', String(sound.enabled));
    btn.querySelector('.sound-wave').toggleAttribute('hidden', !sound.enabled);
    btn.querySelector('.sound-off').toggleAttribute('hidden', sound.enabled);
    btn.title = sound.enabled ? 'كتم الصوت' : 'تشغيل الصوت';
  }
  el('soundBtn').addEventListener('click', () => { sound.toggle(); syncSoundBtn(); });
  el('fullBtn').addEventListener('click', () => toggleFullscreen(el('stage')));

  document.addEventListener('keydown', e => {
    if (/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
    // تفادي تنفيذ الأمر مرتين إذا كان التركيز على زر
    if (e.code === 'Space' && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (e.code === 'Space') {
      e.preventDefault();
      running ? pause() : play();
    } else if (e.key === 'r' || e.key === 'R' || e.key === 'ق') {
      restart();
    } else if (e.key === 's' || e.key === 'S' || e.key === 'س') {
      stop();
    } else if (e.key === 'f' || e.key === 'F' || e.key === 'ب') {
      toggleFullscreen(el('stage'));
    } else if (e.key === 'Escape') {
      el('stage').classList.remove('pseudo-full');
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWake();
  });

  setActivity(store.get('timer:activity', 'نشاط جماعي'));
  el('minInput').value = Math.floor(baseTotal / 60);
  el('secInput').value = baseTotal % 60;
  syncUnit();
  renderPresets();
  render();
})();
</script>
</body>
</html>
