<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مؤقت الأنشطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800&family=Readex+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/tool.css">
<style>
  .timer-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .timer-layout { grid-template-columns: 1fr; }
  }

  .stage {
    --ring: var(--brand);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 28px 20px 32px;
  }

  .stage.is-warn { --ring: var(--gold); }
  .stage.is-done { --ring: var(--danger); }

  .stage:fullscreen,
  .stage.pseudo-full { justify-content: center; }

  .stage-tools {
    position: absolute;
    top: 14px;
    inset-inline-start: 14px;
    display: flex;
    gap: 8px;
    z-index: 3;
  }

  .activity {
    font-family: var(--font-display);
    font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    min-height: 1.2em;
    margin-top: 16px;
  }

  .dial {
    position: relative;
    width: min(100%, 520px);
    aspect-ratio: 1;
    max-width: 100%;
  }

  .stage:fullscreen .dial,
  .stage.pseudo-full .dial { width: min(90vw, 68vh); }

  .dial svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }

  .dial .track { stroke: var(--surface-2); }
  .dial .progress {
    stroke: var(--ring);
    transition: stroke .3s;
  }

  .readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .time {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: clamp(4rem, 15vw, 9rem);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    direction: ltr;
    color: var(--ink);
    letter-spacing: -.02em;
  }

  .stage:fullscreen .time,
  .stage.pseudo-full .time { font-size: min(19vw, 15vh); }

  .stage.is-done .time { color: var(--danger); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .35; } }

  .state-text { color: var(--muted); font-size: 1rem; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .controls .btn { min-width: 150px; font-size: 1.2rem; padding: 14px 28px; }

  /* اللوحة الجانبية */
  .side { display: flex; flex-direction: column; gap: 16px; }

  .presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .preset {
    font: inherit;
    font-weight: 600;
    padding: 12px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .preset:hover { border-color: var(--brand); }
  .preset[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }

  .custom {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: end;
  }

  .custom input { text-align: center; font-variant-numeric: tabular-nums; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit;
    font-size: .88rem;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { background: var(--surface-2); }
</style>
</head>
<body>

<header id="siteHeader" data-base="../" data-page="tools"></header>

<main class="wrap">
  <div class="tool-bar">
    <a class="back-link" href="../tools.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      الأدوات
    </a>
    <h1>مؤقت الأنشطة</h1>
    <span class="tag tag-free">مجانية</span>
  </div>

  <div class="timer-layout">
    <section class="stage" id="stage" aria-label="المؤقت">
      <div class="stage-tools">
        <button class="icon-btn" type="button" id="soundBtn" aria-pressed="true" title="الصوت">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="sound-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="sound-off" d="m16 9 6 6m0-6-6 6" hidden/></svg>
        </button>
        <button class="icon-btn" type="button" id="fullBtn" title="ملء الشاشة (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>

      <div class="activity" id="activityOut">نشاط جماعي</div>

      <div class="dial">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="track" cx="100" cy="100" r="88" fill="none" stroke-width="14"/>
          <circle class="progress" id="progress" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round"/>
        </svg>
        <div class="readout">
          <div class="time" id="time" role="timer" aria-live="off">03:00</div>
          <div class="state-text" id="stateText">جاهز</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" type="button" id="startBtn">ابدأ</button>
        <button class="btn btn-ghost" type="button" id="resetBtn">إعادة</button>
        <button class="btn btn-ghost" type="button" id="plusBtn">+1 دقيقة</button>
      </div>
      <p class="kbd-hint">اختصار: <kbd>مسافة</kbd> تشغيل وإيقاف، <kbd>R</kbd> إعادة، <kbd>F</kbd> ملء الشاشة</p>
    </section>

    <aside class="side">
      <div class="panel">
        <h2>مدة النشاط</h2>
        <div class="presets" id="presets"></div>
        <div class="custom" style="margin-top:14px">
          <div>
            <label class="field-label" for="minInput">دقائق</label>
            <input type="number" id="minInput" min="0" max="180" value="3" inputmode="numeric">
          </div>
          <div>
            <label class="field-label" for="secInput">ثوانٍ</label>
            <input type="number" id="secInput" min="0" max="59" value="0" inputmode="numeric">
          </div>
          <button class="btn btn-ghost" type="button" id="setBtn">تعيين</button>
        </div>
      </div>

      <div class="panel">
        <h2>اسم النشاط</h2>
        <label class="field-label" for="activityInput">يظهر أعلى المؤقت ليعرف الطلاب المطلوب.</label>
        <input type="text" id="activityInput" value="نشاط جماعي" maxlength="40">
        <div class="chips" style="margin-top:10px">
          <button class="chip" type="button">نشاط جماعي</button>
          <button class="chip" type="button">عمل فردي</button>
          <button class="chip" type="button">نقاش</button>
          <button class="chip" type="button">قراءة صامتة</button>
          <button class="chip" type="button">تقويم ختامي</button>
          <button class="chip" type="button">استراحة</button>
        </div>
      </div>
    </aside>
  </div>
</main>

<footer id="siteFooter" data-base="../"></footer>
<script src="../assets/js/layout.js"></script>

<script src="../assets/js/common.js"></script>
<script>
(function () {
  const { store, sound, toggleFullscreen } = window.Rafeeq;
  const el = id => document.getElementById(id);

  const PRESETS = [30, 60, 120, 180, 300, 600, 900, 1200, 1800];
  const WARN_AT = 10; // ثوانٍ: يتحول اللون للذهبي وتبدأ نغمات العد

  const ring = el('progress');
  const CIRC = 2 * Math.PI * 88;
  ring.style.strokeDasharray = CIRC;

  let total = store.get('timer:total', 180);
  let remainingMs = total * 1000;
  let running = false;
  let endAt = 0;
  let raf = 0;
  let lastWholeSec = null;
  let wakeLock = null;

  function fmt(sec) {
    const s = Math.max(0, Math.ceil(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function label(sec) {
    if (sec < 60) return sec + ' ث';
    const m = sec / 60;
    return m + ' د';
  }

  function renderPresets() {
    el('presets').innerHTML = PRESETS.map(s =>
      `<button class="preset" type="button" data-sec="${s}" aria-pressed="${s === total}">${label(s)}</button>`
    ).join('');
  }

  function render() {
    const sec = remainingMs / 1000;
    el('time').textContent = fmt(sec);
    const frac = total > 0 ? Math.max(0, Math.min(1, remainingMs / (total * 1000))) : 0;
    ring.style.strokeDashoffset = CIRC * (1 - frac);
    const stage = el('stage');
    const done = remainingMs <= 0 && total > 0 && !running && lastWholeSec === 0;
    stage.classList.toggle('is-done', done);
    stage.classList.toggle('is-warn', !done && running && sec <= WARN_AT);
    el('stateText').textContent = done ? 'انتهى الوقت' : running ? 'جارٍ' : (remainingMs < total * 1000 ? 'متوقف مؤقتًا' : 'جاهز');
    el('startBtn').textContent = running ? 'إيقاف مؤقت' : (remainingMs < total * 1000 && remainingMs > 0 ? 'استئناف' : 'ابدأ');
    document.title = running ? fmt(sec) + ' · مؤقت الأنشطة' : 'مؤقت الأنشطة';
  }

  function loop() {
    remainingMs = Math.max(0, endAt - performance.now());
    const whole = Math.ceil(remainingMs / 1000);
    if (whole !== lastWholeSec) {
      if (whole > 0 && whole <= 3) sound.beep();
      lastWholeSec = whole;
    }
    if (remainingMs <= 0) {
      running = false;
      lastWholeSec = 0;
      sound.alarm();
      releaseWake();
      render();
      return;
    }
    render();
    raf = requestAnimationFrame(loop);
  }

  function start() {
    if (running) return;
    if (remainingMs <= 0) remainingMs = total * 1000;
    if (remainingMs <= 0) return;
    running = true;
    lastWholeSec = null;
    endAt = performance.now() + remainingMs;
    requestWake();
    raf = requestAnimationFrame(loop);
  }

  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    releaseWake();
    render();
  }

  function reset() {
    pause();
    lastWholeSec = null;
    remainingMs = total * 1000;
    render();
  }

  function setTotal(sec) {
    total = Math.max(1, Math.min(180 * 60, Math.round(sec)));
    store.set('timer:total', total);
    el('minInput').value = Math.floor(total / 60);
    el('secInput').value = total % 60;
    renderPresets();
    reset();
  }

  function addMinute() {
    if (running) {
      endAt += 60000;
      total += 60;
    } else {
      remainingMs += 60000;
      total = Math.max(total, Math.ceil(remainingMs / 1000));
      lastWholeSec = null;
    }
    renderPresets();
    render();
  }

  // إبقاء الشاشة مضاءة أثناء العد
  async function requestWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) { /* تجاهل */ }
    wakeLock = null;
  }

  function setActivity(text) {
    el('activityOut').textContent = text;
    el('activityInput').value = text;
    store.set('timer:activity', text);
  }

  // الأحداث
  el('startBtn').addEventListener('click', () => running ? pause() : start());
  el('resetBtn').addEventListener('click', reset);
  el('plusBtn').addEventListener('click', addMinute);
  el('presets').addEventListener('click', e => {
    const b = e.target.closest('.preset');
    if (b) setTotal(Number(b.dataset.sec));
  });
  el('setBtn').addEventListener('click', () => {
    const m = Number(el('minInput').value) || 0;
    const s = Math.min(59, Number(el('secInput').value) || 0);
    if (m * 60 + s > 0) setTotal(m * 60 + s);
  });
  [el('minInput'), el('secInput')].forEach(inp => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') el('setBtn').click();
  }));
  el('activityInput').addEventListener('input', e => {
    el('activityOut').textContent = e.target.value;
    store.set('timer:activity', e.target.value);
  });
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => setActivity(c.textContent)));

  function syncSoundBtn() {
    const btn = el('soundBtn');
    btn.setAttribute('aria-pressed', String(sound.enabled));
    btn.querySelector('.sound-wave').toggleAttribute('hidden', !sound.enabled);
    btn.querySelector('.sound-off').toggleAttribute('hidden', sound.enabled);
    btn.title = sound.enabled ? 'كتم الصوت' : 'تشغيل الصوت';
  }
  el('soundBtn').addEventListener('click', () => { sound.toggle(); syncSoundBtn(); });
  el('fullBtn').addEventListener('click', () => toggleFullscreen(el('stage')));

  document.addEventListener('keydown', e => {
    if (/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName)) return;
    // تفادي تنفيذ الأمر مرتين إذا كان التركيز على زر
    if (e.code === 'Space' && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    if (e.code === 'Space') {
      e.preventDefault();
      running ? pause() : start();
    } else if (e.key === 'r' || e.key === 'R' || e.key === 'ق') {
      reset();
    } else if (e.key === 'f' || e.key === 'F' || e.key === 'ب') {
      toggleFullscreen(el('stage'));
    } else if (e.key === 'Escape') {
      el('stage').classList.remove('pseudo-full');
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) requestWake();
  });

  setActivity(store.get('timer:activity', 'نشاط جماعي'));
  el('minInput').value = Math.floor(total / 60);
  el('secInput').value = total % 60;
  renderPresets();
  render();
})();
</script>
</body>
</html>
